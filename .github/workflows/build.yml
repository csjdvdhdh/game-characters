name: Build Game

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "=== files ==="
          ls -la
          echo "=== index.html size ==="
          wc -c index.html
          echo "Build OK"
