<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Character Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#0a0a12;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh;background:#0a0a12}
#ui{position:fixed;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:10}
#ui span{background:rgba(0,0,0,.6);color:#eee;padding:6px 12px;border-radius:8px;font-size:14px}
#start{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;color:#fff}
#start h1{font-size:28px;margin-bottom:8px}
#start p{color:#aaa;margin-bottom:24px;text-align:center;max-width:280px}
#start button{background:#6c5ce7;color:#fff;border:none;padding:14px 40px;border-radius:12px;font-size:18px;cursor:pointer}
#chars{display:flex;gap:12px;margin-bottom:28px}
.char-btn{width:80px;height:80px;border-radius:12px;border:3px solid #333;background:#1a1a24;color:#fff;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.char-btn.selected{border-color:#6c5ce7}
.char-btn span{font-size:28px;margin-bottom:4px}
</style>
</head>
<body>
<div id="ui"><span id="score">Score: 0</span><span id="hp">HP: 100</span></div>
<div id="start">
  <h1>Character Shooter</h1>
  <p>اختر شخصيتك ثم اضغط ابدأ<br>حرّك بإصبعك / الماوس • اضغط للإطلاق</p>
  <div id="chars">
    <button class="char-btn selected" data-c="0"><span>🥊</span>Fighter</button>
    <button class="char-btn" data-c="1"><span>🖤</span>Girl</button>
    <button class="char-btn" data-c="2"><span>🐻</span>Bear</button>
  </div>
  <button id="go">ابدأ</button>
</div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,player,bullets,enemies,particles,score,hp,gameOn=false,selected=0,keys={},mouse={x:0,y:0,down:false};

const CHARS=[
  {name:'Fighter',color:'#6b8cce',accent:'#c4a88a',speed:4.2,dmg:12,fireRate:180},
  {name:'Girl',color:'#9b59b6',accent:'#e8c4b0',speed:5.0,dmg:9,fireRate:140},
  {name:'Bear',color:'#c4a035',accent:'#5b2c8a',speed:3.4,dmg:18,fireRate:260}
];

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);resize();

document.querySelectorAll('.char-btn').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('.char-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=+b.dataset.c}
});
document.getElementById('go').onclick=()=>{document.getElementById('start').style.display='none';startGame()};

function startGame(){
  const ch=CHARS[selected];
  player={x:W/2,y:H-100,r:22,color:ch.color,accent:ch.accent,speed:ch.speed,dmg:ch.dmg,fireRate:ch.fireRate,lastFire:0,angle: -Math.PI/2};
  bullets=[];enemies=[];particles=[];score=0;hp=100;gameOn=true;
  spawnLoop();
  requestAnimationFrame(loop);
}

function spawnLoop(){
  if(!gameOn)return;
  const side=Math.random()<0.5;
  enemies.push({
    x:side? -30:W+30,
    y:40+Math.random()*(H*0.5),
    r:16+Math.random()*10,
    hp:20+Math.random()*30,
    speed:1.2+Math.random()*1.8,
    color:`hsl(${Math.random()*40+0},70%,50%)`
  });
  setTimeout(spawnLoop,900+Math.random()*700);
}

function shoot(){
  const now=performance.now();
  if(now-player.lastFire<player.fireRate)return;
  player.lastFire=now;
  const a=player.angle;
  bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*11,vy:Math.sin(a)*11,r:5,dmg:player.dmg,color:player.color});
}

function loop(){
  if(!gameOn)return;
  ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='#141420';ctx.lineWidth=1;
  for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
  for(let i=0;i<H;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke()}

  // move player
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['a'])dx-=1;
  if(keys['ArrowRight']||keys['d'])dx+=1;
  if(keys['ArrowUp']||keys['w'])dy-=1;
  if(keys['ArrowDown']||keys['s'])dy+=1;
  if(mouse.down||keys[' '])shoot();
  const len=Math.hypot(dx,dy)||1;
  player.x+= (dx/len)*player.speed;
  player.y+= (dy/len)*player.speed;
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));
  player.angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);

  // draw player
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.angle+Math.PI/2);
  // body
  ctx.fillStyle=player.color;
  ctx.beginPath();ctx.ellipse(0,0,player.r,player.r*1.15,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=player.accent;
  ctx.beginPath();ctx.arc(0,-6,10,0,Math.PI*2);ctx.fill();
  // gun
  ctx.fillStyle='#ccc';
  ctx.fillRect(-3,-player.r-14,6,18);
  ctx.restore();

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){bullets.splice(i,1);continue}
    ctx.fillStyle=b.color;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  }

  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const ang=Math.atan2(player.y-e.y,player.x-e.x);
    e.x+=Math.cos(ang)*e.speed;
    e.y+=Math.sin(ang)*e.speed;
    // hit player
    if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){
      hp-=8;enemies.splice(i,1);
      if(hp<=0){gameOver();return}
      continue;
    }
    // hit by bullet
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){
        e.hp-=b.dmg;bullets.splice(j,1);
        for(let k=0;k<6;k++)particles.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:20,color:e.color});
        if(e.hp<=0){score+=10;enemies.splice(i,1)}
        break;
      }
    }
    ctx.fillStyle=e.color;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(e.x-4,e.y-3,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(e.x+4,e.y-3,3,0,Math.PI*2);ctx.fill();
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0){particles.splice(i,1);continue}
    ctx.globalAlpha=p.life/20;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  document.getElementById('score').textContent='Score: '+score;
  document.getElementById('hp').textContent='HP: '+Math.max(0,hp|0);
  requestAnimationFrame(loop);
}

function gameOver(){
  gameOn=false;
  document.getElementById('start').style.display='flex';
  document.getElementById('start').querySelector('h1').textContent='انتهت اللعبة';
  document.getElementById('start').querySelector('p').textContent='النقاط: '+score;
  document.getElementById('go').textContent='العب مرة ثانية';
}

// input
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);
canvas.addEventListener('pointerdown',e=>{mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY});
canvas.addEventListener('pointerup',()=>mouse.down=false);
canvas.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
canvas.addEventListener('touchstart',e=>{e.preventDefault();mouse.down=true;mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY},{passive:false});
canvas.addEventListener('touchend',()=>mouse.down=false);
canvas.addEventListener('touchmove',e=>{e.preventDefault();mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY},{passive:false});
</script>
</body>
</html>
